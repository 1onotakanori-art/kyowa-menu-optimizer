<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>通知メールの停止</title>
  <link rel="stylesheet" href="style.css">
  <style>
    html, body {
      height: auto;
      min-height: 100%;
    }

    .content {
      max-width: 520px;
      margin: 0 auto;
      padding: 16px;
    }

    .card {
      background: white;
      border-radius: var(--border-radius);
      padding: 24px 16px;
      box-shadow: var(--shadow);
      font-size: 15px;
      line-height: 1.7;
    }

    .card p {
      margin-bottom: 16px;
    }

    .result-ok {
      color: var(--success-color);
      font-weight: 700;
    }

    .result-error {
      color: var(--danger-color);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <header class="header">
    <h1>🔔 通知メールの停止</h1>
    <p class="subtitle">共和食堂メニュー通知</p>
  </header>

  <main class="content">
    <div class="card">
      <p id="message">朝の通知メールを停止します。よろしければ下のボタンを押してください。</p>
      <button id="unsubscribe-button" class="button button-primary" type="button">通知メールを停止する</button>
      <p style="margin: 16px 0 0; font-size: 13px; color: #666;">
        通知を再開したいときや、条件だけ変えたいときは
        <a href="notify.html">通知設定ページ</a> から変更できます。
      </p>
    </div>
  </main>

  <script>
    (function () {
      var FUNCTION_URL = 'https://zzleqjendqkoizbdvblw.supabase.co/functions/v1/unsubscribe';
      var token = new URLSearchParams(location.search).get('token');
      var message = document.getElementById('message');
      var button = document.getElementById('unsubscribe-button');

      function showResult(text, ok) {
        message.textContent = text;
        message.className = ok ? 'result-ok' : 'result-error';
      }

      if (!token) {
        showResult('リンクが正しくありません。メールに記載のリンクから開いてください。', false);
        button.disabled = true;
        return;
      }

      button.addEventListener('click', function () {
        button.disabled = true;
        button.textContent = '処理中...';
        fetch(FUNCTION_URL + '?token=' + encodeURIComponent(token), { method: 'POST' })
          .then(function (res) { return res.json(); })
          .then(function (body) {
            if (body.ok) {
              showResult('通知メールを停止しました。', true);
              button.style.display = 'none';
            } else {
              showResult(body.error || '停止できませんでした。', false);
              button.disabled = false;
              button.textContent = '通知メールを停止する';
            }
          })
          .catch(function () {
            showResult('通信に失敗しました。時間をおいてもう一度お試しください。', false);
            button.disabled = false;
            button.textContent = '通知メールを停止する';
          });
      });
    })();
  </script>
</body>
</html>
